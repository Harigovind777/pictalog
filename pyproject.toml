[project]
name = "pictalog"
version = "0.1.0"
description = "Turn any catalog file into a product catalog with realistic AI product photos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "odfpy>=1.4",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pillow>=10.4",
    "reportlab>=4.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pictalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
